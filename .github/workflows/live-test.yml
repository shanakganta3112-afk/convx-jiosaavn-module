name: live-test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Search, decrypt and fetch a real JioSaavn stream
        run: node test-live.js "tum hi ho arijit singh"
      - name: Second query (Hindi + English mix)
        if: always()
        run: node test-live.js "kesariya arijit singh"
